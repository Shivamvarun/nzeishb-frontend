<div class="pareto-shell">
  <section class="glass-panel pareto-main">
    <div class="panel-header">
      <div>
        <h3>Optimización · frente de Pareto</h3>
        <p>Proyección de coste, energía, industrialización y repetibilidad</p>
      </div>
      <button type="button" class="btn-secondary" (click)="loadMore()" [disabled]="visibleLimit >= state.variants.length">Más variantes</button>
    </div>

    <div class="filters">
      <label>Coste máx. <input type="range" min="120000" max="220000" step="5000" [(ngModel)]="maxCost" (input)="renderChart()"><span>{{ maxCost | number }} €</span></label>
      <label>Energía máx. <input type="range" min="15" max="70" step="1" [(ngModel)]="maxEnergy" (input)="renderChart()"><span>{{ maxEnergy }} kWh/m²a</span></label>
      <label>Indus. mín. <input type="range" min="0" max="100" step="5" [(ngModel)]="minIndustrialization" (input)="renderChart()"><span>{{ minIndustrialization }}%</span></label>
      <label>Rotación 3D <input type="range" min="-60" max="60" step="5" [(ngModel)]="rotation" (input)="renderChart()"><span>{{ rotation }} °</span></label>
    </div>

    <div class="chart-wrapper">
      <canvas #paretoChart></canvas>
    </div>
  </section>

  <aside class="glass-panel variant-panel">
    <div class="panel-header"><h3>Variantes no dominadas</h3></div>
    <div class="variant-cards-list">
      <button type="button" *ngFor="let v of filteredVariants" class="variant-card" [class.selected]="state.selectedVariant.id === v.id" (click)="selectVariant(v.id)">
        <div class="variant-header">
          <span>{{ v.name }}</span>
          <span class="tag-badge {{ v.tagClass }}">{{ v.tag }}</span>
        </div>
        <div class="variant-stats">
          <div>Coste: {{ v.costPerUnit | number }} €/ud</div>
          <div>Energía: {{ v.primaryEnergyDemandKwh }} kWh/m²a</div>
          <div>Industrialización: {{ (v.degreeIndustrialization * 100) | number:'1.0-0' }}%</div>
        </div>
        <span class="compare-chip" [class.active]="isCompared(v.id)" (click)="compareVariant(v.id, $event)">{{ isCompared(v.id) ? 'En comparación' : 'Comparar' }}</span>
      </button>
    </div>
  </aside>
</div>
